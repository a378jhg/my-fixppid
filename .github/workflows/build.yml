name: Build Zygisk Module

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r26b

    # 核心修复：链接从 master 改成了 main，这下绝对能下下来了
    - name: Download Zygisk API
      run: |
        curl -L -f -o jni/zygisk.hpp https://raw.githubusercontent.com/Dr-TSNG/Zygisk-API/main/include/zygisk.hpp

    - name: Build Native Module
      run: |
        cd jni
        cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
        cmake --build build

    - name: Package Zygisk Module
      run: |
        mkdir -p package/zygisk
        cp jni/build/libppid_spoofer.so package/zygisk/arm64-v8a.so
        cp module.prop package/
        cp packages.txt package/
        cd package
        zip -r ../PPIDSpoofer.zip *

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: PPIDSpoofer-Zygisk
        path: PPIDSpoofer.zip
