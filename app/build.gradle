apply plugin: 'com.android.application'

android {
    namespace 'com.custom.fixppid'
    compileSdk 34

    defaultConfig {
        applicationId "com.custom.fixppid"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    
    // 加入自动签名配置
    signingConfigs {
        release {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release // 应用签名
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
